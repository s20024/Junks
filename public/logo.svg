<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- カラーパレット: 輪郭 #4A2410 / 前面 #B25B16 / 側面 #9E4F10 / 耳 #C0651C -->
  <g stroke-linecap="round" stroke-linejoin="round" transform="translate(-33 32)">
    <!-- アンテナ基部(グレー台座) -->
    <path d="M 402 310 L 414 258 Q 416 250 426 250 L 570 250 Q 580 250 582 258 L 594 310 Z"
          fill="#A6A6A6" stroke="#4A2410" stroke-width="20"/>
    <!-- アンテナの赤いランプ -->
    <circle cx="497" cy="186" r="62" fill="#E8474F" stroke="#4A2410" stroke-width="22"/>

    <!-- 頭部シルエット(前面は横長の角丸四角、右に側面) -->
    <path d="M 215 310 L 772 310 L 920 366 Q 972 382 972 440 L 972 690 Q 972 762 904 786 Q 842 816 790 830 Q 772 834 714 834 L 228 834 Q 110 834 110 725 L 110 415 Q 110 310 215 310 Z"
          fill="#B25B16"/>
    <!-- 側面(やや暗い面) -->
    <path d="M 696 310 L 772 310 L 920 366 Q 972 382 972 440 L 972 690 Q 972 762 904 786 Q 842 816 790 830 Q 780 834 742 834 L 696 834 Q 800 834 800 730 L 800 414 Q 800 310 696 310 Z"
          fill="#9E4F10"/>

    <!-- 口(あごの継ぎ目) -->
    <path d="M 116 686 L 798 713" fill="none" stroke="#4A2410" stroke-width="24"/>
    <!-- 前面と側面の継ぎ目(前面は角丸四角形) -->
    <path d="M 696 310 Q 800 310 800 414 L 800 730 Q 800 834 696 834" fill="none" stroke="#4A2410" stroke-width="24"/>
    <!-- 頭部の輪郭線(上描き) -->
    <path d="M 215 310 L 772 310 L 920 366 Q 972 382 972 440 L 972 690 Q 972 762 904 786 Q 842 816 790 830 Q 772 834 714 834 L 228 834 Q 110 834 110 725 L 110 415 Q 110 310 215 310 Z"
          fill="none" stroke="#4A2410" stroke-width="24"/>

    <!-- 右側面のノブ(耳) -->
    <ellipse cx="920" cy="570" rx="60" ry="92" fill="#C0651C" stroke="#4A2410" stroke-width="24"/>

    <!-- 目(左右とも正円) -->
    <circle cx="285" cy="524" r="106" fill="#FFFFFF" stroke="#4A2410" stroke-width="24"/>
    <circle cx="590" cy="528" r="112" fill="#FFFFFF" stroke="#4A2410" stroke-width="24"/>
    <circle cx="228" cy="525" r="32" fill="#4A2410"/>
    <circle cx="619" cy="540" r="35" fill="#4A2410"/>
  </g>
</svg>
